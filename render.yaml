services:
  - type: web
    name: fittrack-api
    runtime: python
    plan: free
    rootDir: fitnesspro/fittrack_pro_backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Set in the Render dashboard, never in this file.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

  # Static frontend for the React app in fitnesspro/web.
  # VITE_API_URL is inlined by Vite at build time, so the built site
  # talks to the live API above. No SPA rewrite rules needed: the app
  # navigates with in-app state, not browser routes.
  # NOTE: the live site was created directly in Render, not via this
  # Blueprint — Blueprint sync rejects a plan for static sites
  # ("no such plan free for service type web"). Static sites carry no
  # plan field, so none is declared here; the live site auto-deploys
  # from master on push.
  - type: web
    name: fittrack-web
    env: static
    rootDir: fitnesspro/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://fittrack-api-h8qz.onrender.com
